name: Trigger Cloudflare Pages Rebuild

on:
  schedule:
    # 毎日 午前0時(JST) に自動再ビルド (UTC 15:00)
    - cron: '0 15 * * *'
  workflow_dispatch: # GitHubのWeb画面から手動ボタン一発で再ビルド可能にする設定

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Deploy Hook
        run: |
          curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"